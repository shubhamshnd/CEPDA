<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Port network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>

<main id="stage">
  <svg id="map" role="img" aria-label="Map of India showing ports and their link to the Mumbai head office"></svg>

  <header class="brand">
    <h1>Port network</h1>
    <p id="brand-sub">Loading locations</p>
  </header>

  <div class="clock" aria-live="off">
    <span id="clock-time">--:--</span>
    <span id="clock-meta"></span>
  </div>

  <div class="map-controls" role="group" aria-label="Map view">
    <button type="button" id="btn-india">All India</button>
    <button type="button" id="btn-ports">Zoom to ports</button>
  </div>

  <ul class="legend" aria-label="Legend">
    <li><span class="key key-port"></span>Port, click for its summary</li>
    <li><span class="key key-ho"></span>Head office</li>
    <li><span class="key key-arc"></span>Reporting line</li>
  </ul>

  <div id="map-error" class="map-error" hidden></div>
</main>

<aside id="panel" class="panel" aria-hidden="true" aria-labelledby="panel-title" tabindex="-1">
  <div class="panel-scroll">
    <div id="panel-hero" class="panel-hero">
      <img id="panel-img" alt="" hidden>
      <div class="panel-hero-text">
        <h2 id="panel-title">Port</h2>
        <p id="panel-region"></p>
      </div>
      <button type="button" id="panel-close" class="panel-close" aria-label="Close summary">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <p id="panel-meta" class="panel-meta"></p>
    <div id="panel-body" class="panel-body"></div>
  </div>
</aside>

<script src="{{ url_for('static', filename='vendor/d3.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/topojson-client.min.js') }}"></script>
<script>
  window.PORTNET = {
    topo: "{{ url_for('static', filename='data/india.topo.json') }}",
    network: "{{ url_for('network') }}",
    summary: "{{ url_for('summary', code='__CODE__') }}"
  };
</script>
<script src="{{ url_for('static', filename='js/panel.js') }}"></script>
<script src="{{ url_for('static', filename='js/map.js') }}"></script>
</body>
</html>

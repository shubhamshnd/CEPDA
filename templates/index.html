<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JSW Infrastructure | Port network</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
<link rel="preload" href="{{ url_for('static', filename='fonts/barlow-400.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>

<main id="stage">
  <svg id="map" role="img" aria-label="Map of JSW Infrastructure ports and terminals in India and the UAE, linked to the Mumbai head office"></svg>

  <aside id="side" class="side" aria-label="JSW Infrastructure at a glance">
    <div class="side-head">
      <img class="brand-logo" src="{{ url_for('static', filename='img/jsw-logo-white.png') }}" alt="JSW Infrastructure">
    </div>
    <div id="side-body" class="side-body"><p class="side-tag">Loading locations</p></div>
  </aside>

  <div class="clock" aria-live="off">
    <span id="clock-time">--:--</span>
    <span id="clock-meta"></span>
  </div>

  <p id="zoom-hint" class="zoom-hint" hidden>Double-click the map or press Esc to zoom out</p>
  <p id="fleet-key" class="fleet-key" hidden><b>MBC fleet</b>
    <span><svg viewBox="-7 -4 15 8" width="15" height="8" aria-hidden="true"><path class="loaded" d="M7,0 L3,-3.2 L-6,-3.2 L-6,3.2 L3,3.2 Z"/></svg>Loaded <b data-n="loaded">0</b></span>
    <span><svg viewBox="-7 -4 15 8" width="15" height="8" aria-hidden="true"><path class="empty" d="M7,0 L3,-3.2 L-6,-3.2 L-6,3.2 L3,3.2 Z"/></svg>Empty <b data-n="empty">0</b></span>
  </p>

  <details id="support" class="support">
    <summary aria-label="Support and credits" title="Support">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.8 7.6a2.3 2.3 0 1 1 3.3 2.1c-.7.4-1.1.9-1.1 1.6v.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="14.4" r="1" fill="currentColor"/></svg>
    </summary>
    <div class="support-card">
      <p>Developed in-house by the <b>JSW Infra IT & Digital</b> team</p>
      <a href="mailto:shubham.shinde@jsw.in?subject=Port%20network%20dashboard%20support">Email support</a>
    </div>
  </details>



  <div id="map-error" class="map-error" hidden></div>
</main>

<aside id="panel" class="panel" aria-hidden="true" aria-labelledby="panel-title" tabindex="-1">
  <div class="panel-scroll">
    <div id="panel-hero" class="panel-hero">
      <img id="panel-img" alt="" hidden>
      <div class="panel-hero-text">
        <h2 id="panel-title">Port</h2>
        <p id="panel-region"></p>
      </div>
      <button type="button" id="panel-close" class="panel-close" aria-label="Close summary">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <p id="panel-meta" class="panel-meta"></p>
    <div id="panel-body" class="panel-body"></div>
  </div>
</aside>

<script src="{{ url_for('static', filename='vendor/d3.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/topojson-client.min.js') }}"></script>
<script>
  window.PORTNET = {
    topo: "{{ url_for('static', filename='data/india.topo.json') }}",
    world: "{{ url_for('static', filename='data/world-50m.json') }}",
    network: "{{ url_for('network') }}",
    summary: "{{ url_for('summary', code='__CODE__') }}"
  };
</script>
<script src="{{ url_for('static', filename='js/panel.js') }}"></script>
<script src="{{ url_for('static', filename='js/side.js') }}"></script>
<script src="{{ url_for('static', filename='js/map.js') }}"></script>
</body>
</html>
